  # bob74_ipl, fivem-freecam and screenshot-basic ship inside the framework
  # repository above (unmodified, MIT), so nothing more is downloaded here.

  - action: remove_path
    path: ./tmp

  # Database: creates it if needed. vr-core installs its own tables on first start.
  - action: connect_database

  - action: write_file
    file: ./server.cfg
    data: |
      ## Generated by the ValRavn Framework recipe
      {{serverEndpoints}}

      sv_hostname "{{serverName}}"
      sets sv_projectName "{{serverName}}"
      sets sv_projectDesc "{{recipeDescription}}"
      sets tags "roleplay"
      sets locale "en-US"

      sv_licenseKey "{{svLicense}}"
      sv_maxclients {{maxClients}}
      sv_enforceGameBuild 3751
      set steam_webApiKey "none"
      set resources_useSystemChat true
      set mysql_connection_string "{{dbConnectionString}}"

      ensure chat
      ensure baseevents

      setr sv_stateBagStrictMode true
      set sv_endpointPrivacy true
      set sv_filterRequestControl 1
      set sv_enableNetworkedSounds false
      setr vr-clothing:printlevel 2
      setr voice_useNativeAudio true

      ## Order matters
      ensure vr-mysql
      ensure vr-core
      ensure vr-ui
      ensure vr-lib
      ensure vr-keybinds
      ensure vr-bridge
      ensure vr-voice
      ensure vr-target
      ensure vr-inventory
      ensure fivem-freecam
      ensure bob74_ipl
      ensure [vr]

      ## Bring your own maps, clothing and vehicles, then ensure them here.
      #ensure [maps]
      #ensure [clothing]
      #ensure [cars]

      ## Admins. Replace YOUR_FIVEM_ID with your own identifier, then restart.
      add_ace command.garage command allow
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      #add_principal identifier.fivem:YOUR_FIVEM_ID group.admin

      add_ace resource.vr-core command allow
      add_principal group.admin vrcore.god
      add_principal vrcore.god vrcore.admin
      add_principal vrcore.admin vrcore.mod
