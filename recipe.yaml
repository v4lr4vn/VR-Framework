name: ValRavn Framework
version: v1.0.0-alpha.1
author: ValRavn
description: >-
  ALPHA: Full FiveM roleplay framework: vr-core, the vr-bridge adapter, the Night Shift
  interface and 50+ gameplay resources. Needs only an empty database.

$engine: 3
$minFxVersion: 5000
$onesync: on

# If you forked this repository, change the src below to your fork before you
# paste this recipe into txAdmin.
tasks:
  # Cfx.re default resources (provides baseevents)
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    dest: ./tmp/cfx-server-data
  - action: copy_path
    src: ./tmp/cfx-server-data/resources
    dest: ./resources

  # The ValRavn Framework: one download per resource, from the release/ folder of
  # this repository. Each zip holds one resource folder and unzips into [important]
  # or [vr]. vr-emotes is split in two because GitHub rejects files over 100 MB.

  ## resources/[important]
