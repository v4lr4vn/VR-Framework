    url: https://raw.githubusercontent.com/v4lr4vn/VR-Framework/main/release/bob74_ipl.zip
    path: ./tmp/bob74_ipl.zip
    timeoutSeconds: 600
  - action: unzip
    src: ./tmp/bob74_ipl.zip
    dest: ./resources/[important]

