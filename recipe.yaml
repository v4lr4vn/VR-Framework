name: ValRavn Framework
version: v1.0.0-alpha.1
author: ValRavn
description: >-
  ALPHA: Full FiveM roleplay framework: vr-core, the vr-bridge adapter, the Night Shift
  interface and 50+ gameplay resources. Needs only an empty database.

$engine: 2
$minFxVersion: 5000
$onesync: on

# If you forked this repository, change the src below to your fork before you
# paste this recipe into txAdmin.
tasks:
  # Cfx.re default resources (provides baseevents)
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    dest: ./tmp/cfx-server-data
  - action: copy_path
    src: ./tmp/cfx-server-data/resources
    dest: ./resources

  # The ValRavn Framework itself
  - action: download_github
    src: https://github.com/v4lr4vn/VR-Framework
    dest: ./tmp/valravn-framework
    timeoutSeconds: 600
  - action: copy_path
    src: ./tmp/valravn-framework/resources
    dest: ./resources
    timeoutSeconds: 600

  # bob74_ipl, fivem-freecam and screenshot-basic ship inside the framework
  # repository above (unmodified, MIT), so nothing more is downloaded here.

  - action: remove_path
    path: ./tmp

  # Database: creates it if needed. vr-core installs its own tables on first start.
  - action: connect_database

  - action: write_file
    file: ./server.cfg
    data: |
      ## Generated by the ValRavn Framework recipe
      {{serverEndpoints}}

      sv_hostname "{{serverName}}"
      sets sv_projectName "{{serverName}}"
      sets sv_projectDesc "{{recipeDescription}}"
      sets tags "roleplay"
      sets locale "en-US"

      sv_licenseKey "{{svLicense}}"
      sv_maxclients {{maxClients}}
      sv_enforceGameBuild 3751
      set steam_webApiKey "none"
      set resources_useSystemChat true
      set mysql_connection_string "{{dbConnectionString}}"

      ensure chat
      ensure baseevents

      setr sv_stateBagStrictMode true
      set sv_endpointPrivacy true
      set sv_filterRequestControl 1
      set sv_enableNetworkedSounds false
      setr vr-clothing:printlevel 2
      setr voice_useNativeAudio true

      ## Order matters
      ensure vr-mysql
      ensure vr-core
      ensure vr-ui
      ensure vr-lib
      ensure vr-keybinds
      ensure vr-bridge
      ensure vr-voice
      ensure vr-target
      ensure vr-inventory
      ensure fivem-freecam
      ensure bob74_ipl
      ensure [vr]

      ## Bring your own maps, clothing and vehicles, then ensure them here.
      #ensure [maps]
      #ensure [clothing]
      #ensure [cars]

      ## Admins. Replace YOUR_FIVEM_ID with your own identifier, then restart.
      add_ace command.garage command allow
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      #add_principal identifier.fivem:YOUR_FIVEM_ID group.admin

      add_ace resource.vr-core command allow
      add_principal group.admin vrcore.god
      add_principal vrcore.god vrcore.admin
      add_principal vrcore.admin vrcore.mod
